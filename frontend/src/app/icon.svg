<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing shield outline -->
  <path d="M16 3 L25 7 V14 C25 20 21.2 25.5 16 28 C10.8 25.5 7 20 7 14 V7 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
  
  <!-- Network activity waveform inside the shield -->
  <path d="M10 15.5 L12.5 15.5 L14.5 10.5 L16.5 20.5 L18.5 12.5 L20.5 15.5 L22 15.5" 
        fill="none" 
        stroke="#22d3ee" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
