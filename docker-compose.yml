version: '3.8'
services:
  backend:
    build: .
    container_name: netsentinel-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: netsentinel-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: netsentinel-agent
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
